services:
  backend:
    image: registry.digitalocean.com/venue-tracker/backend:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-venue_tracker}
      - DJANGO_SETTINGS_MODULE=settings
      - DEBUG=0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOW_ALL_ORIGINS=False
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - PYTHONUNBUFFERED=1
      - DJANGO_LOG_LEVEL=INFO
    command: >
      sh -c "python manage.py migrate --no-input &&
             daphne -v2 -b 0.0.0.0 -p 8000 asgi:application"
    restart: always

  frontend:
    image: registry.digitalocean.com/venue-tracker/frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000/api}
      - REACT_APP_BACKEND_HOST=${REACT_APP_BACKEND_HOST:-localhost:8000}
    restart: always

  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-venue_tracker}
    restart: always

volumes:
  postgres_data: 